services:
  stegaformer_train:
    build: ./modules/watermarking/stegaformer
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./modules/watermarking/stegaformer:/app:rw
    command: ["python", "train.py"]
    profiles: ["train-stegaformer"]

  stegaformer_watermarking:
    image: wafis-icaoeval-stegaformer_train:latest
    container_name: stegaformer_watermarking_service
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./experiments/output/watermarking:/app/output:rw
      - ./modules/watermarking/stegaformer:/app:rw
    entrypoint: ["python", "run_watermark.py"]
    command: "python run_watermark.py $@"
    profiles: ["inference-stegaformer"]

  facenet_recognizer:
    image: timesler/jupyter-dl-gpu:latest
    user: root
    container_name: facenet_recognizer_service
    working_dir: /app
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./experiments/output:/app/output:rw
      - ./modules/recognition/facenet/run_recognizer.py:/app/run_recognizer.py:ro
      - ./modules/recognition/facenet/recognizer.py:/app/recognizer.py:ro
      - ./modules/recognition/facenet/test_similarity.py:/app/test_similarity.py:ro
      - ./modules/recognition/facenet/run_experiments.sh:/app/run_experiments.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
    - bash
    - -c
    - |
      pip install -q facenet_pytorch scipy==1.3.3 pandas==0.25.3 ipython==7.11.1 openpyxl==3.1.3 && \
      exec python run_recognizer.py "$@"
    - --
    profiles: ["facenet"] #pip install --upgrade torch torchvision #pip install facenet-pytorch==2.5.3

  facenet_recognizer_v2:
      image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
      container_name: facenet_recognizer_v2_service
      working_dir: /app
      volumes:
        - ./datasets:/app/facial_data:ro
        - ./experiments/output:/app/output:rw
        - ./modules/recognition/facenet/run_recognizer.py:/app/run_recognizer.py:ro
        - ./modules/recognition/facenet/recognizer.py:/app/recognizer.py:ro
        - ./modules/recognition/facenet/test_similarity.py:/app/test_similarity.py:ro
        - ./modules/recognition/facenet/run_experiments.sh:/app/run_experiments.sh:ro
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
      entrypoint:
        - bash
        - -c
        - |
          pip install -q facenet_pytorch scipy pandas tqdm Pillow openpyxl opencv-python-headless==3.4.18.65 && \
          exec python run_recognizer.py "$@"
        - --
      profiles: ["facenet_v2"]

  arcface_recognizer:
    image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
    container_name: arcface_recognizer_service
    working_dir: /app
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./experiments/output:/app/output:rw
      - ./models/arcface:/app/models:ro          
      - ./modules/recognition/arcface/run_recognizer.py:/app/run_recognizer.py:ro
      - ./modules/recognition/arcface/recognizer.py:/app/recognizer.py:ro
      - ./modules/recognition/arcface/test_similarity.py:/app/test_similarity.py:ro
      - ./modules/recognition/arcface/run_experiments.sh:/app/run_experiments.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - bash
      - -c
      - |
        pip install -q facenet_pytorch scipy pandas tqdm Pillow openpyxl opencv-python-headless==3.4.18.65 scikit-image && \
        exec python run_recognizer.py "$@"
      - --
    profiles: ["arcface"]

  tensorboard_viewer:
    image: tensorflow/tensorflow:2.13.0
    ports:
      - "6006:6006"
    volumes:
      - ./modules/watermarking:/app/:rw
    working_dir: /app
    entrypoint: []
    profiles: ["tensorboard"]
    command: ["tensorboard", "--logdir", "/app", "--host", "0.0.0.0", "--port", "6006"]

  tensorboard_viewer_experiments:
    image: tensorflow/tensorflow:2.13.0
    ports:
      - "6006:6006"
    volumes:
      - ./experiments/output:/app/:rw
    working_dir: /app
    entrypoint: []
    profiles: ["tensorboard"]
    command: ["tensorboard", "--logdir", "/app", "--host", "0.0.0.0", "--port", "6006"]

  stegformer_train:
    build:
      context: ./modules/watermarking/stegformer
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./modules/watermarking/stegformer:/app:rw
    entrypoint: ["python", "train.py"]
    command: "python train.py $@"
    profiles: ["train-stegformer"]

  stegformer_watermarking:
    image: wafis-icaoeval-stegformer_train:latest
    container_name: stegformer_watermarking_service
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./experiments/output/watermarking:/app/output:rw
      - ./modules/watermarking/stegformer:/app:rw
    entrypoint: ["python", "run_watermark.py"]
    command: "python run_watermark.py $@"
    profiles: ["inference-stegformer"]

  attack_embeddings_simulator:
    build: ./modules/attacks/adversarial/attack_embeddings
    container_name: attack_embeddings_simulator_service
    working_dir: /app
    volumes:
      - ./datasets:/app/facial_data:ro
      - ./experiments/output:/app/output:rw
      - ./modules/attacks/adversarial/attack_embeddings:/app:rw
      - ./modules/watermarking:/app/watermarking:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["python", "train.py"]
    profiles: ["attack-embeddings-simulator"]